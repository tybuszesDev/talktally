# Lint, typecheck, test and build (ADR-0012, ADR-0017). On pull requests only the workspaces
# affected by the change run; pushes to main run everything and refresh the Turborepo cache.
# The secret scan (gitleaks) checks every pushed commit, whichever workspaces it touches.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Turborepo --affected compares with the base branch
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version from packageManager

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:versions

      - name: Lint, typecheck, test and build workspaces
        run: pnpm exec turbo run lint typecheck test build $AFFECTED
        env:
          AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
          # The checkout has no local base branch, only the remote-tracking one.
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          # .node-version names only the major version; the exact one goes into every task hash.
          NODE_VERSION: ${{ steps.node.outputs.node-version }}

      - name: Lint root files and check formatting
        run: pnpm exec eslint scripts '*.config.js' && pnpm exec prettier --check .

      # Whole-repository checks (ADR-0017): import rules from ADR-0001, then unused code.
      - name: Check architecture
        run: pnpm check:architecture

      - name: Check unused code
        run: pnpm check:unused

      - name: Test repository scripts
        run: pnpm test:scripts

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The scanned range starts at the base of the pull request.
          persist-credentials: false

      # The gitleaks CLI (MIT) from its official image, the same version as the pre-commit hook.
      # Range: the commits of the pull request, or the commits of a push to main.
      - name: Scan the pushed commits with gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        env:
          # The checkout belongs to the runner user and the container runs as root, so git
          # refuses the repository without this. Environment config is a protected scope.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: >-
            git --redact --verbose --no-banner
            --log-opts=${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.event.after) }}
            .

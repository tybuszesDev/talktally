# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
# Independent AI review of every pull request (ADR-0021). Every finding is fixed or answered
# before merge; the main ruleset requires resolved review threads.
language: en-US
tone_instructions: >-
  Report only real problems: bugs, security, data loss, broken CI, violated ADRs or project
  rules. Skip style, wording, Markdown edge cases and deliberate misuse by the author.

reviews:
  profile: chill
  # Pull request descriptions follow the template and are checked by CI, so CodeRabbit must
  # not edit them. The summary stays in the walkthrough comment.
  high_level_summary: false
  poem: false
  suggested_reviewers: false
  # One automatic review when a pull request is opened; later pushes only on
  # "@coderabbitai review" (ADR-0023, docs/CODE-REVIEW.md).
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: false
  # CodeRabbit writes code only when the owner replies "@coderabbitai fix comments" in a
  # finding's thread (ADR-0023).
  # The other code-writing finishing touches stay off.
  finishing_touches:
    autofix:
      enabled: true
    unit_tests:
      enabled: false
    docstrings:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
  path_instructions:
    - path: 'docs/adr/**'
      instructions: >-
        Accepted ADRs are immutable. Only the status line and links may change; a changed
        decision needs a new ADR that supersedes or amends the old one.
    - path: '.github/workflows/**'
      instructions: >-
        Third-party actions must be pinned by full commit SHA with the version in a comment.
        Permissions are least privilege. Untrusted input (titles, bodies, branch names) reaches
        scripts only through environment variables, never through inline expressions.
    - path: 'packages/domain/**'
      instructions: >-
        Platform-neutral code: no DOM, React Native or AWS SDK imports. Pure functions with unit
        tests; coverage threshold 90% of lines.
    - path: '**/*.test.*'
      instructions: >-
        Tests follow Arrange-Act-Assert, describe behaviour in their names and never call real
        AWS services or Bedrock.
  tools:
    # ESLint and Prettier already run with the repository configuration in CI.
    eslint:
      enabled: false
    # Markdown is written by hand and is not formatted (see .prettierignore).
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - CLAUDE.md
      - docs/WORKING-AGREEMENT.md

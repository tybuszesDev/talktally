# OpenSSF Scorecard (ADR-0017): rates the security practices of the repository on main and
# publishes the result for the README badge. Not a pull request check.
# Copied from ossf/scorecard-action examples/scorecard.yml. Publishing the results only works
# while this workflow keeps the API restrictions: no top-level env or defaults, no top-level
# write permissions, and only the approved actions in the job.
# https://github.com/ossf/scorecard-action#workflow-restrictions
name: Scorecard

on:
  # For the Branch-Protection check. Only the default branch is supported.
  branch_protection_rule:
  # Keeps the Maintained check up to date.
  schedule:
    - cron: '41 4 * * 1' # Weekly, Monday 04:41 UTC.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}
# Blocks all cache access (GitHub Actions key added in September 2026).
cache-mode: none

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scorecard only supports the default branch.
    if: ${{ github.event.repository.default_branch == github.ref_name }}
    permissions:
      security-events: write # Upload SARIF to code scanning.
      id-token: write # Sign the results published to api.scorecard.dev.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        if: ${{ always() }}
        with:
          sarif_file: results.sarif

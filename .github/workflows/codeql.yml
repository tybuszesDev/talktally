# CodeQL code scanning (ADR-0017), based on GitHub's "CodeQL Advanced" starter workflow.
# Results appear in the Security tab; the main ruleset blocks merges on new high or critical
# security alerts and on error-level alerts. No path filters: the ruleset needs results for
# every pull request.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1' # Weekly, Monday 04:23 UTC: new queries also find issues in old code.

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # Upload the results to code scanning.
    strategy:
      fail-fast: false
      matrix:
        # Both are interpreted, so no build is needed. `actions` checks the workflows themselves.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Deliberately broken code for scripts/check-architecture.test.mjs.
          config: |
            paths-ignore:
              - scripts/fixtures

      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:${{ matrix.language }}
